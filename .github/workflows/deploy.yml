name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level grant: each job asks only for what it needs, so the
# build job cannot mint an OIDC token or write to Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # persist-credentials: false leaves no git token in .git/config on
      # the runner. Nothing here does authenticated git afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pinned to the repo's packageManager version, not latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # project pages serve at /<repo>/; custom domain would be /
          BASE_PATH: /howlbox/

      # 404.html, robots.txt, sitemap.xml and the per-route index.html
      # files are emitted by the seo plugin during the build.

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only the deploy job needs to write Pages and mint the OIDC token
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
