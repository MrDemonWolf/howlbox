name: CI

# Deploy only runs `bun run build`, which does not typecheck, so without
# this a type error or a failing test reaches production green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: CI never writes to the repo, deploys, or mints an OIDC token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false leaves no git token in .git/config on
      # the runner. Nothing here does authenticated git afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pinned to the repo's packageManager version, not latest, so CI is
      # reproducible and a bad Bun release cannot break the pipeline
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # non-mutating gate: biome ci + check-types (vite build + tsc) +
      # tests + the production build, matching what `bun ci` runs locally
      - name: Verify
        run: bun run ci
        env:
          BASE_PATH: /howlbox/
